openapi: 3.0.3
info:
  title: Demo Target API
  description: Especificação do alvo de demonstração do lt
  version: 1.0.0
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: "4100" }
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 50 }
  schemas:
    Echo:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        quantidade: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string, enum: [novo, usado] } }
paths:
  /fast:
    get:
      operationId: fast
      responses: { "200": { description: ok } }
  /products:
    get:
      operationId: listarProdutos
      parameters:
        - {
            name: page,
            in: query,
            required: true,
            schema: { type: integer, minimum: 1, maximum: 10 },
          }
        - { name: filtro, in: query, required: false, schema: { type: string } }
      responses: { "200": { description: ok } }
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: detalheProduto
      responses: { "200": { description: ok }, "404": { description: não existe } }
  /echo:
    post:
      operationId: criarEcho
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Echo" }
      responses: { "200": { description: ok } }
    delete:
      operationId: apagarEcho
      responses: { "204": { description: apagado } }
