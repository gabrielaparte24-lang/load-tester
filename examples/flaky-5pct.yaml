# Validação da ferramenta: 5% de erros 500 no alvo.
# Esperado: errorRate ≈ 5% (com 6000 requisições, 95% das execuções ficam entre ~4,45% e ~5,55%).
name: validate-flaky-5pct
target:
  baseUrl: http://127.0.0.1:4100
load:
  model: open
  stages:
    - { duration: 30s, rps: 200 }
flow:
  - name: flaky
    request: { method: GET, path: /flaky, query: { rate: "0.05" } }
