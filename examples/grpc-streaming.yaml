# yaml-language-server: $schema=../schema/scenario.schema.json
# gRPC com streaming: os três tipos, num cenário com três fluxos.
#  - server streaming: a requisição vai em `message`; o script lê mensagens (expect) e o resto do
#    stream é lido até o status final;
#  - client streaming: as mensagens vão no script (send); a resposta única é checada no expect da etapa;
#  - bidi: send/expect intercalados; `end` encerra o envio (também é implícito no fim do script).
# A latência da etapa é o stream inteiro. O resumo mostra a 1ª mensagem e o RTT por mensagem.
# Rode o alvo de demonstração antes: npm start -- --with-demo (gRPC na porta 4102)
name: grpc-streaming
description: Countdown (server), Sum (client) e Chat (bidi) do demo.Greeter
target:
  baseUrl: http://127.0.0.1:4102
  timeoutMs: 2000 # tempo máximo de cada espera (mensagem ou fim do stream)
seed: 21
load:
  model: open
  stages:
    - { duration: 15s, rps: 30 }
thresholds:
  - "p95 < 300ms"
  - "errorRate < 1%"
variables:
  a: "${randInt(1, 100)}"
  b: "${randInt(1, 100)}"
flows:
  - name: contagem regressiva
    steps:
      - name: Countdown
        grpc:
          proto: ../packages/demo-target/proto/demo.proto
          service: demo.Greeter
          method: Countdown
          message: { from: 5, interval_ms: 20 }
          deadline: 5s # prazo do stream inteiro
          script:
            - expect: { jsonPath: { "$.n": 5, "$.remaining": 4 } }
            - expect: { jsonPath: { "$.n": 4 } }
        expect:
          grpcStatus: OK
          messages: 5 # total recebido
          jsonPath: { "$.message": "fim!" } # última mensagem
  - name: soma
    steps:
      - name: Sum
        grpc:
          proto: ../packages/demo-target/proto/demo.proto
          service: demo.Greeter
          method: Sum
          script:
            - send: { value: "${a}" }
            - send: { value: "${b}" }
            - send: { value: 0.5 }
        expect:
          jsonPath: { "$.count": 3, "$.total": "> 2" }
        extract:
          total: "$.total"
  - name: conversa
    steps:
      - name: Chat
        grpc:
          proto: ../packages/demo-target/proto/demo.proto
          service: demo.Greeter
          method: Chat
          metadata: { x-sessao: "${uuid()}" }
          script:
            - send: { name: "Ana" }
            - expect: { jsonPath: { "$.message": "Olá, Ana!" } }
              extract: { quem: "$.metadata.x-sessao" }
            - send: { name: "${quem}" }
            - expect: { bodyMatches: "Olá, [0-9a-f-]{36}!" }
            - end: true
        expect: { messages: 2 }
