// Serviço gRPC de demonstração (lt / demo-target): unário e os três tipos de streaming.
syntax = "proto3";

package demo;

service Greeter {
  // Responde na hora: "Olá, <name>!" (repetido `times` vezes) e ecoa os metadados recebidos.
  rpc SayHello (HelloRequest) returns (HelloReply);
  // Responde após `ms` milissegundos (máx. 60 s).
  rpc Slow (SlowRequest) returns (HelloReply);
  // Falha com o status `code` (padrão 14 = UNAVAILABLE) a cada `every` chamadas ou com probabilidade `rate`.
  rpc Flaky (FlakyRequest) returns (HelloReply);
  // Bidirecional: responde "Olá, <name>!" a cada mensagem recebida (após delay_ms, se informado).
  rpc Chat (stream HelloRequest) returns (stream HelloReply);
  // Server streaming: envia from, from-1, …, 1 a cada interval_ms; com fail_at > 0, falha com
  // ABORTED depois de enviar fail_at mensagens.
  rpc Countdown (CountdownRequest) returns (stream Tick);
  // Client streaming: soma os valores recebidos e responde no fim.
  rpc Sum (stream Number) returns (SumReply);
}

message CountdownRequest {
  int32 from = 1;
  int32 interval_ms = 2;
  int32 fail_at = 3;
}

message Tick {
  int32 n = 1;
  int32 remaining = 2;
  string message = 3;
}

message Number {
  double value = 1;
}

message SumReply {
  double total = 1;
  int32 count = 2;
}

message HelloRequest {
  string name = 1;
  int32 times = 2;
  int32 delay_ms = 3;
}

message SlowRequest {
  int32 ms = 1;
  string name = 2;
}

message FlakyRequest {
  int32 every = 1;
  double rate = 2;
  int32 code = 3;
}

message HelloReply {
  string message = 1;
  int32 length = 2;
  repeated string tags = 3;
  int64 served_at = 4;
  map<string, string> metadata = 5;
}
